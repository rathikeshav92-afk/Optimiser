name: Test & build Windows app

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Smoke-test hardware detection
        run: python -c "from pcoptimizer.system_info import collect_specs; from pcoptimizer.rating import rate; s = collect_specs(); print(s); print(rate(s))"
      - name: Smoke-test sensors and benchmark
        run: |
          python -c "import time; from pcoptimizer.sensors import SensorMonitor; m = SensorMonitor(); m.start(); time.sleep(12); print(m.latest); m.stop(); assert m._proc is not None"
          python -c "from pcoptimizer import benchmark; r = benchmark.run(lambda m, p: print(m)); print(r); assert r.score > 0"
      - name: Smoke-test screen time tracker
        shell: pwsh
        run: |
          python ci/screentime_smoke.py *>&1 | Tee-Object -FilePath screentime-smoke.txt
          exit $LASTEXITCODE
      - name: Upload screen time smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screentime-smoke
          path: screentime-smoke.txt
          if-no-files-found: ignore
      - name: Smoke-test driver updates
        shell: pwsh
        run: |
          python ci/drivers_smoke.py *>&1 | Tee-Object -FilePath drivers-smoke.txt
          exit $LASTEXITCODE
      - name: Upload driver smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drivers-smoke
          path: drivers-smoke.txt
          if-no-files-found: ignore
      - name: Smoke-test toolkit, registry and services
        shell: pwsh
        run: |
          python ci/system_smoke.py *>&1 | Tee-Object -FilePath system-smoke.txt
          exit $LASTEXITCODE
      - name: Upload system smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-smoke
          path: system-smoke.txt
          if-no-files-found: ignore
      - name: Build PCOptimizer.exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin --collect-submodules anthropic --name PCOptimizer launcher.py
      - name: Self-test the built exe
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process -FilePath dist\PCOptimizer.exe -ArgumentList "--selftest", "`"$out`"" -Wait -PassThru
          Get-Content $out
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: PCOptimizer
          path: dist/PCOptimizer.exe
